[workspace]
resolver = "2"
members = [
    "crates/pimble-core",
    "crates/pimble-crdt",
    "crates/pimble-store",
    "crates/pimble-search",
    "crates/pimble-rpc",
    "crates/pimble-server",
    "crates/pimble-client",
    "crates/pimble-plugins",
    "crates/pimble-app",
    "crates/pimble-cli",
    "crates/pimble-import",
    "crates/pimble-cloud",
    "crates/pimble-crypto",
]

[workspace.package]
version = "0.3.3"
edition = "2021"
authors = ["Pimble Contributors"]
license = "MIT"
repository = "https://github.com/pimble/pimble"

[workspace.dependencies]
# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
base64 = "0.22"

# Identifiers
uuid = { version = "1.0", features = ["v4", "serde"] }

# Async runtime
tokio = { version = "1.0", features = ["full"] }

# JSON-RPC
jsonrpsee = { version = "0.24", features = ["server", "client", "macros"] }

# WASM runtime
wasmtime = "27"

# Search and graph index engine (Joe's rhypedb). default-features off keeps the
# ONNX/fastembed stack out; pimble-search's `semantic` feature turns it on.
rhypedb-engine = { git = "https://github.com/joeleaver/rhypedb.git", branch = "master", default-features = false }
rhypedb-schema = { git = "https://github.com/joeleaver/rhypedb.git", branch = "master" }
rhypedb-query = { git = "https://github.com/joeleaver/rhypedb.git", branch = "master", default-features = false }

# UI framework, tracked from GitHub main (never the local checkout). `rinch` itself is
# declared in crates/pimble-app/Cargo.toml (default features off there; the `native`
# feature re-adds desktop, file-dialogs, clipboard, debug, collaboration; `web` uses
# rinch-web), because the same UI library builds for the browser. The desktop build
# renders on the GPU (`rinch/gpu`), which needs rinch's wgpu fork: see `[patch.crates-io]`
# at the end of this file.
rinch-tabler-icons = { git = "https://github.com/joeleaver/rinch.git", branch = "pimble/perf" }
rinch-editor-core = { git = "https://github.com/joeleaver/rinch.git", branch = "pimble/perf" }
# Headless collab session (yrs projection of the editor model); pure Rust, no
# platform deps, so the server and store can link it for text projection.
rinch-editor-collab = { git = "https://github.com/joeleaver/rinch.git", branch = "pimble/perf" }

# CRDT for node content: the same engine rinch's editor collaboration uses.
yrs = "0.27"

# Error handling
thiserror = "2.0"
anyhow = "1.0"

# Time
chrono = { version = "0.4", features = ["serde"] }

# URL handling
url = { version = "2.5", features = ["serde"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Async utilities
futures = "0.3"
async-trait = "0.1"

# Channels for thread communication
crossbeam-channel = "0.5"

# Markdown parsing
pulldown-cmark = "0.12"

# File watching
notify = "7.0"

# Internal crates
pimble-core = { path = "crates/pimble-core" }
pimble-crypto = { path = "crates/pimble-crypto" }
pimble-crdt = { path = "crates/pimble-crdt" }
pimble-store = { path = "crates/pimble-store" }
pimble-search = { path = "crates/pimble-search" }
pimble-rpc = { path = "crates/pimble-rpc" }
pimble-server = { path = "crates/pimble-server" }
pimble-client = { path = "crates/pimble-client" }
pimble-plugins = { path = "crates/pimble-plugins" }
pimble-import = { path = "crates/pimble-import" }

# rinch's own patches, repeated here because a dependency's `[patch]` does not reach
# the crates that use it. Keep this block the same as rinch's root Cargo.toml.
# wgpu: fixes Rgba8Unorm storage texture validation, needed for transparent windows
# with vello on Windows (DX12 + DirectComposition); gfx-rs/wgpu#8908.
# winit: Wayland drag-and-drop, which upstream 0.31-beta.2 does not implement.
[patch.crates-io]
wgpu = { git = "https://github.com/joeleaver/wgpu-fork", branch = "rinch-patch" }
wgpu-core = { git = "https://github.com/joeleaver/wgpu-fork", branch = "rinch-patch" }
wgpu-hal = { git = "https://github.com/joeleaver/wgpu-fork", branch = "rinch-patch" }
wgpu-types = { git = "https://github.com/joeleaver/wgpu-fork", branch = "rinch-patch" }
naga = { git = "https://github.com/joeleaver/wgpu-fork", branch = "rinch-patch" }
winit = { git = "https://github.com/joeleaver/winit-fork", branch = "rinch-patch" }
winit-core = { git = "https://github.com/joeleaver/winit-fork", branch = "rinch-patch" }
winit-common = { git = "https://github.com/joeleaver/winit-fork", branch = "rinch-patch" }
winit-wayland = { git = "https://github.com/joeleaver/winit-fork", branch = "rinch-patch" }
winit-x11 = { git = "https://github.com/joeleaver/winit-fork", branch = "rinch-patch" }
dpi = { git = "https://github.com/joeleaver/winit-fork", branch = "rinch-patch" }
