name: CI

on:
  push:
    branches: [master, main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  # ubuntu-24.04: the static ONNX Runtime the workspace links needs glibc 2.38
  # (see release.yml).
  check:
    name: cargo check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          # ubuntu-22.04 runners ship a google-chrome apt source this build
          # never uses; its CDN intermittently serves a stale index and
          # `apt-get update` treats one bad repo as fatal, failing every step
          # after it. Drop it rather than depend on Google's CDN for a Rust
          # build (see joeleaver/rinch's own CI for the same workaround).
          sudo rm -f /etc/apt/sources.list.d/google-chrome*.list \
                     /etc/apt/sources.list.d/google-chrome*.sources
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev libglib2.0-dev libatk1.0-dev libcairo2-dev \
            libpango1.0-dev libgdk-pixbuf2.0-dev libxdo-dev libmpv-dev

      # The browser holds one path since wave 5 of
      # docs/ONE_CODEBASE_CONTRACT.md: its own server, nothing beside it.
      - name: No second path in web/
        run: scripts/check-one-path.sh

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: cargo check --workspace --all-targets
        run: cargo check --workspace --all-targets

      # The library's index tool is behind a feature, so the workspace check
      # misses it; the Release workflow runs it, and it broke there once.
      - name: cargo check the plugin index tool
        run: cargo check -p pimble-plugin-host --features index-tool --bins

  # The browser build (web/) is its own workspace with its own lock, and only
  # the deploy built it: a lock that broke the worker's wasm build (two
  # getrandom versions handed to ahash, 0.32.0) passed CI and failed on jkbase.
  web:
    name: cargo check (web, wasm)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: web

      - name: cargo check the web app and its worker
        working-directory: web
        run: cargo check --locked --workspace --target wasm32-unknown-unknown

  test:
    name: cargo test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo rm -f /etc/apt/sources.list.d/google-chrome*.list \
                     /etc/apt/sources.list.d/google-chrome*.sources
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev libglib2.0-dev libatk1.0-dev libcairo2-dev \
            libpango1.0-dev libgdk-pixbuf2.0-dev libxdo-dev libmpv-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      # The accounts service's integration tests (and the sharing tests that
      # run it) need a real rhypedb-server, which skipped every one of them
      # here until it was built. rhypedb publishes no binaries, so it is built
      # from the revision Cargo.lock pins for rhypedb-client (the server's
      # protocol must match the client's), once per revision, without the
      # ONNX embedder (the accounts schema has no @vectorize field).
      - name: Find the rhypedb revision Cargo.lock pins
        id: rhypedb
        run: |
          rev="$(grep -A2 '^name = "rhypedb-client"$' Cargo.lock | grep -oE '#[0-9a-f]{40}' | tr -d '#')"
          if [ -z "$rev" ]; then
            echo "Cargo.lock names no git revision for rhypedb-client" >&2
            exit 1
          fi
          echo "rev=$rev" >> "$GITHUB_OUTPUT"

      - name: Cache rhypedb-server
        id: rhypedb-cache
        uses: actions/cache@v4
        with:
          path: ~/rhypedb-server
          key: rhypedb-server-${{ runner.os }}-${{ steps.rhypedb.outputs.rev }}

      - name: Build rhypedb-server
        if: steps.rhypedb-cache.outputs.cache-hit != 'true'
        env:
          REV: ${{ steps.rhypedb.outputs.rev }}
        run: |
          git clone --filter=blob:none https://github.com/joeleaver/rhypedb.git "$RUNNER_TEMP/rhypedb"
          git -C "$RUNNER_TEMP/rhypedb" checkout --detach "$REV"
          cargo build --release --locked --no-default-features -p rhypedb-server \
            --manifest-path "$RUNNER_TEMP/rhypedb/Cargo.toml"
          mkdir -p ~/rhypedb-server
          cp "$RUNNER_TEMP/rhypedb/target/release/rhypedb-server" ~/rhypedb-server/

      # RHYPEDB_SERVER_REQUIRED makes a missing server fail those tests
      # instead of skipping them.
      - name: cargo test --workspace --release
        run: |
          export RHYPEDB_SERVER_BIN="$HOME/rhypedb-server/rhypedb-server"
          export RHYPEDB_SERVER_REQUIRED=1
          cargo test --workspace --release
