name: Release

on:
  push:
    tags:
      - "v*"
  # Builds and checks the packages from a branch, without releasing them: the
  # release job runs for a tag only.
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

jobs:
  # ubuntu-24.04, not 22.04: the prebuilt static ONNX Runtime that
  # `onnx-download` links (ort-sys 2.0.0-rc.12) was built against glibc 2.38
  # (`__isoc23_strtol` and friends), so linking on 22.04's glibc 2.35 fails and
  # the shipped Linux binary needs glibc 2.38 or newer (Ubuntu 24.04, Debian 13,
  # Fedora 39). The keyword-only build (`--no-default-features --features
  # native`) has no such floor.
  build-linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          # See ci.yml for why the google-chrome source is dropped first.
          sudo rm -f /etc/apt/sources.list.d/google-chrome*.list \
                     /etc/apt/sources.list.d/google-chrome*.sources
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev libglib2.0-dev libatk1.0-dev libcairo2-dev \
            libpango1.0-dev libgdk-pixbuf2.0-dev libxdo-dev libmpv-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      # Default features (native + onnx-download, crates/pimble-app/Cargo.toml)
      # ship semantic search statically linked, as intended for a real release.
      - name: Build pimble-app and pimble-mcp (release)
        run: cargo build -p pimble-app -p pimble-mcp --release

      - name: Package
        run: |
          version="$(grep -m1 '^version = ' Cargo.toml | sed -E 's/version = "(.*)"/\1/')"
          tools/package.sh "$version" target/release/pimble dist

      - uses: actions/upload-artifact@v4
        with:
          name: linux-package
          path: dist/*.tar.gz
          if-no-files-found: error

  # Required since v0.3.2, the first tag it built for: every Windows build up
  # to v0.3.1 failed in rhypedb-storage's Unix-only `Mmap::advise`
  # (joeleaver/rhypedb#23). Check it locally before tagging with
  # `cargo xwin check -p pimble-app --release --target x86_64-pc-windows-msvc`
  # (it needs `llvm-lib` on PATH).
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # No system packages beyond the standard MSVC toolchain the runner
      # image already carries -- rinch's windows backend needs nothing
      # analogous to the GTK/mpv dev headers the Linux build links.
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build pimble-app and pimble-mcp (release)
        run: cargo build -p pimble-app -p pimble-mcp --release

      - name: Package
        shell: pwsh
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"' | Select-Object -First 1).Matches[0].Groups[1].Value
          $stage = "dist/pimble-$version-windows-x86_64"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item target/release/pimble.exe "$stage/pimble.exe"
          Copy-Item target/release/pimble-mcp.exe "$stage/pimble-mcp.exe"
          if (Test-Path LICENSE) { Copy-Item LICENSE "$stage/" }
          if (Test-Path README.md) { Copy-Item README.md "$stage/" }
          Compress-Archive -Path "$stage/*" -DestinationPath "dist/pimble-$version-windows-x86_64.zip"
          "version=$version" >> $env:GITHUB_ENV

      # The per-user installer (tools/windows/pimble.iss): the folder the
      # updater keeps current, with its marker (docs/UPDATE_CONTRACT.md).
      - name: Build the installer
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          $installer = "dist/installer-stage"
          New-Item -ItemType Directory -Force -Path $installer | Out-Null
          Copy-Item target/release/pimble.exe, target/release/pimble-mcp.exe $installer
          Set-Content -Path "$installer/pimble-install.json" -Value "{`"version`":`"$env:version`"}" -NoNewline -Encoding ascii
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$env:version" "/DStage=$PWD\$installer" "/DOutDir=$PWD\dist" tools\windows\pimble.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # Install, look, uninstall, look again: the runner is a real Windows.
      - name: Check the installer
        shell: pwsh
        run: |
          $setup = "dist/pimble-$env:version-windows-x86_64-setup.exe"
          Start-Process -Wait -FilePath $setup -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART"
          $app = "$env:LOCALAPPDATA\Programs\Pimble"
          foreach ($f in "pimble.exe", "pimble-mcp.exe", "pimble-install.json") {
            if (-not (Test-Path "$app\$f")) { throw "the installer did not put $f in $app" }
          }
          $marker = Get-Content "$app\pimble-install.json" | ConvertFrom-Json
          if ($marker.version -ne $env:version) { throw "the marker says $($marker.version), not $env:version" }
          if (-not (Test-Path "$env:APPDATA\Microsoft\Windows\Start Menu\Programs\Pimble.lnk")) { throw "no Start-menu entry" }
          Start-Process -Wait -FilePath "$app\unins000.exe" -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART"
          Start-Sleep -Seconds 3
          if (Test-Path "$app\pimble.exe") { throw "the uninstaller left pimble.exe" }
          Write-Host "installed to $app, marker $($marker.version), Start-menu entry, uninstalled cleanly"

      - uses: actions/upload-artifact@v4
        with:
          name: windows-package
          path: |
            dist/*.zip
            dist/*-setup.exe
          if-no-files-found: error

  release:
    needs: [build-linux, build-windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    steps:
      - name: Download packaged artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Flatten artifact layout
        run: |
          mkdir -p release
          find dist -type f \( -name '*.tar.gz' -o -name '*.zip' -o -name '*-setup.exe' \) -exec cp {} release/ \;
          ls -la release

      # Every package gets a detached Ed25519 signature beside it, which the
      # desktop app verifies before it installs an update
      # (docs/UPDATE_CONTRACT.md). No key, no release: an unsigned package would
      # be refused by every installed copy anyway.
      - name: Sign packages
        env:
          SIGNING_KEY: ${{ secrets.PIMBLE_UPDATE_SIGNING_KEY }}
        run: |
          if [ -z "$SIGNING_KEY" ]; then
            echo "PIMBLE_UPDATE_SIGNING_KEY is not set: run tools/update-key.sh once" >&2
            exit 1
          fi
          key="$(mktemp)"
          trap 'rm -f "$key"' EXIT
          printf '%s\n' "$SIGNING_KEY" > "$key"
          for package in release/*.tar.gz release/*.zip release/*-setup.exe; do
            openssl pkeyutl -sign -rawin -inkey "$key" -in "$package" -out "$package.sig"
          done
          ls -la release

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
