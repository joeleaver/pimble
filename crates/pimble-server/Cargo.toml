[package]
name = "pimble-server"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Local and remote server implementation for Pimble"

[dependencies]
pimble-core = { workspace = true }
pimble-crdt = { workspace = true }
pimble-store = { workspace = true }
# The disk, paths and key rest a server is handed (docs/ONE_CODEBASE_CONTRACT.md seams B-E).
pimble-host = { workspace = true }
pimble-search = { workspace = true }
pimble-plugins = { workspace = true }
pimble-sheet = { workspace = true }
pimble-discussion = { workspace = true }
pimble-rpc = { workspace = true }
pimble-client = { workspace = true }
# No workspace entry yet (docs/CRYPTO_CONTRACT.md phase 2a is still landing);
# a direct path dependency, same as pimble-cloud's.
pimble-crypto = { path = "../pimble-crypto" }
chrono = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# tokio's locks, channels and `select!` (`sync`, `macros`) build for wasm32; the
# runtime itself is the host's (pimble-host's `Runtime`).
tokio = { version = "1", default-features = false, features = ["sync", "macros"] }
thiserror = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }
base64 = { workspace = true }
url = { workspace = true }
http = "1"
rand = "0.9"
# Constant-time comparison for the bearer/API-key check (decision 1); already
# in the dependency tree transitively (a crypto crate rhypedb-embed pulls in),
# declared directly here so pimble-server can use it.
subtle = "2.6"
sha2 = "0.10"
futures = { workspace = true }

# The desktop's server: jsonrpsee's HTTP/WebSocket server and the HTTP edge in
# front of it, tokio's whole runtime, the platform's directories, and the
# native-only modules (local.rs, auth.rs, jwt.rs, logs.rs, diagnostics.rs,
# memory.rs, relay_tunnel.rs). None of it builds for a browser's worker
# (docs/ONE_CODEBASE_CONTRACT.md wave 3), which serves the same handler over a
# `MessagePort` (crates/pimble-worker).
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
jsonrpsee = { workspace = true }
tokio = { workspace = true }
tracing-subscriber = { workspace = true }
dirs = "6"
# EdDSA (Ed25519) JWT verification (docs/CLOUD_CONTRACT.md "B: pimble-server"
# item 1): the JWT itself is parsed by hand (see src/jwt.rs) rather than
# through a JWT crate, so this is only the signature primitive.
ed25519-dalek = "2.2"
# Diagnostics records go gzipped (src/diagnostics.rs).
flate2 = "1"
# HTTP-edge auth middleware (docs/history/HARDENING_CONTRACT.md decision 1), wired
# onto jsonrpsee via `Server::builder().set_http_middleware(...)`. Pinned to
# the same major version jsonrpsee-server 0.24 depends on internally: the
# `tower::ServiceBuilder<T>` that function takes must be the same `tower`
# crate, or the types don't unify.
tower = { version = "0.4", features = ["util"] }
http-body = "1"
bytes = "1"
# Fetching the JWKS. rustls (not the default-tls/openssl backend) per the
# contract; no default features so openssl-sys never enters the dependency
# tree.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
# The owner's tunnel to Pimble Cloud's relay and the loopback connections it
# pipes members to (docs/RELAY_CONTRACT.md; src/relay_tunnel.rs): plain
# WebSockets with binary frames, request headers and close codes, none of
# which jsonrpsee's client hands over. The version axum's `ws` already
# brings into the workspace (pimble-cloud), so the lock file gains nothing;
# rustls with the platform's roots, as jsonrpsee's own `wss` has.
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-native-roots"] }

# A browser's worker: jsonrpsee's types and client core only (no `server`
# feature: it pulls in mio and spawns with `tokio::spawn`), as pimble-rpc and
# pimble-client have it there; randomness from the page's crypto.
[target.'cfg(target_arch = "wasm32")'.dependencies]
jsonrpsee = { version = "0.24", default-features = false, features = ["client-core", "macros"] }
getrandom = { version = "0.3", features = ["wasm_js"] }

[target.'cfg(all(target_os = "linux", target_env = "gnu"))'.dependencies]
# memory.rs: malloc_trim, to give a large canvas's freed copies back.
libc = "0.2"

[dev-dependencies]
tempfile = "3"
# notices.rs's tests build a discussion's document the way the app does.
yrs = { workspace = true }
# `PIMBLE_TEST_DISK=memory` runs the suite on the memory disk (pimble_host::disk::testfs).
pimble-host = { workspace = true, features = ["test-disk"] }
# tests/search.rs makes a board node the way the app does (its board written
# with the create) and finds the words on it.
pimble-board = { workspace = true }
# A tiny local JWKS endpoint for jwt.rs's and tests/auth.rs's tests
# (docs/CLOUD_CONTRACT.md "B: pimble-server" item 8).
axum = "0.8"
# tests/relay.rs's stand-in for Pimble Cloud's relay upgrades two of the
# accounts stub's routes to WebSockets by hand (hyper's upgrade, then
# tokio-tungstenite in the server role), so axum's own `ws` feature, which
# would bring a second tungstenite into the lock file, stays off. Both are in
# the tree already, under axum.
hyper = "1"
hyper-util = { version = "0.1", features = ["tokio"] }

[features]
# Semantic search. Choose one ONNX link mode; see crates/pimble-search/Cargo.toml.
onnx-download = ["pimble-search/onnx-download"]
onnx-dynamic = ["pimble-search/onnx-dynamic"]
