[package]
name = "pimble-server"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Local and remote server implementation for Pimble"

[dependencies]
pimble-core = { workspace = true }
pimble-crdt = { workspace = true }
pimble-store = { workspace = true }
pimble-search = { workspace = true }
pimble-plugins = { workspace = true }
pimble-rpc = { workspace = true }
pimble-client = { workspace = true }
chrono = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
jsonrpsee = { workspace = true }
tokio = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
uuid = { workspace = true }
base64 = { workspace = true }
url = { workspace = true }
dirs = "6"
# HTTP-edge auth middleware (docs/history/HARDENING_CONTRACT.md decision 1), wired
# onto jsonrpsee via `Server::builder().set_http_middleware(...)`. Pinned to
# the same major version jsonrpsee-server 0.24 depends on internally: the
# `tower::ServiceBuilder<T>` that function takes must be the same `tower`
# crate, or the types don't unify.
tower = { version = "0.4", features = ["util"] }
http = "1"
http-body = "1"
bytes = "1"
rand = "0.9"
# Constant-time comparison for the bearer/API-key check (decision 1); already
# in the dependency tree transitively (a crypto crate rhypedb-embed pulls in),
# declared directly here so pimble-server can use it.
subtle = "2.6"
# EdDSA (Ed25519) JWT verification (docs/CLOUD_CONTRACT.md "B: pimble-server"
# item 1): the JWT itself is parsed by hand (see src/jwt.rs) rather than
# through a JWT crate, so this is only the signature primitive.
ed25519-dalek = "2.2"
# Fetching the JWKS. rustls (not the default-tls/openssl backend) per the
# contract; no default features so openssl-sys never enters the dependency
# tree.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }

[dev-dependencies]
tempfile = "3"
# A tiny local JWKS endpoint for jwt.rs's and tests/auth.rs's tests
# (docs/CLOUD_CONTRACT.md "B: pimble-server" item 8).
axum = "0.8"

[features]
# Semantic search. Choose one ONNX link mode; see crates/pimble-search/Cargo.toml.
onnx-download = ["pimble-search/onnx-download"]
onnx-dynamic = ["pimble-search/onnx-dynamic"]
