[package]
name = "pimble-plugin-sdk"
version = "0.15.1"
edition = "2021"
license = "MIT"
publish = false
description = "Write a Pimble plugin: plain rinch in a wasm32-wasip1 guest"
# A member of the plugins workspace (plugins/Cargo.toml), not the main one: plugins
# build for wasm32-wasip1 with their own lock and target directory, at a rinch
# revision of their own (the main lock moves only with `cargo update rinch`).
workspace = "../../plugins"

[dependencies]
pimble-plugin-abi = { path = "../pimble-plugin-abi" }
# The API a plugin uses (docs/PLUGINS_CONTRACT.md wave 2), without its RPC
# backend: a plugin reaches the stores through the host (`GuestBackend`).
pimble-api = { path = "../pimble-api", default-features = false }
pimble-core = { path = "../pimble-core" }
# A node's label as the explorer shows it reads its text (`display_label`).
pimble-crdt = { path = "../pimble-crdt" }
pimble-rpc = { path = "../pimble-rpc" }
# Presence, icons and colors as the app draws them (docs/PRESENCE_CONTRACT.md
# "Plugins"): a plugin draws with the app's own components.
pimble-ui = { path = "../pimble-ui" }
futures = "0.3"
async-trait = "0.1"
serde_json = "1"
# The reactor entry `_initialize` is the toolchain's from Rust 1.100 on (`export!`).
rustversion = "1"
# Components and theme only, nothing browser-specific: a wasm32-wasip1 guest runs
# inside a host that is not a browser. rinch gates its browser halves on
# `target_os = "unknown"` (joeleaver/rinch#2088, merged 2026-11-02), so main
# builds for wasip1 with no panicking stubs.
rinch = { git = "https://github.com/joeleaver/rinch.git", branch = "main", default-features = false, features = [
    "components",
    "theme",
] }

[dev-dependencies]
# rinch's headless document, to render the same component directly and through a
# RemoteDocument and compare the trees.
rinch-core = { git = "https://github.com/joeleaver/rinch.git", branch = "main", features = ["test-util"] }
