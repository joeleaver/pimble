[package]
name = "pimble-core"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Core types and traits for Pimble personal information manager"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
base64 = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
url = { workspace = true }
thiserror = { workspace = true }
# Blob ids are 128 random bits (docs/IMAGES_CONTRACT.md): more than a v4 uuid
# holds, so they come from the system's generator directly. The version
# pimble-crypto already uses.
getrandom = "0.2"

# uuid v4 and getrandom need a randomness backend in the browser; the native
# build has one.
[target.'cfg(target_arch = "wasm32")'.dependencies]
uuid = { workspace = true, features = ["js"] }
getrandom = { version = "0.2", features = ["js"] }
