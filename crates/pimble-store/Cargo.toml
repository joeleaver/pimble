[package]
name = "pimble-store"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Store abstraction for local and remote storage in Pimble"

[dependencies]
pimble-core = { workspace = true }
pimble-crdt = { workspace = true }
# The disk every file of a store goes through (docs/ONE_CODEBASE_CONTRACT.md seam B).
pimble-host = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
chrono = { workspace = true }
# A state report's blob is kept base64 in its `reports` file
# (docs/CONVERGENCE_CONTRACT.md section 1).
base64 = { workspace = true }
uuid = { workspace = true }
tracing = { workspace = true }
url = { workspace = true }
notify = { workspace = true }
# A blob's header carries the SHA-256 of its image (docs/IMAGES_CONTRACT.md);
# the version pimble-crypto already uses.
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"
# `PIMBLE_TEST_DISK=memory` runs the suite on the memory disk (pimble_host::disk::testfs).
pimble-host = { workspace = true, features = ["test-disk"] }
