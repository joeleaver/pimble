[package]
name = "pimble-store"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Store abstraction for local and remote storage in Pimble"

[dependencies]
pimble-core = { workspace = true }
pimble-crdt = { workspace = true }
# The disk every file of a store goes through (docs/ONE_CODEBASE_CONTRACT.md seam B).
pimble-host = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# The store itself needs only tokio's locks (`sync`, which builds for wasm32).
tokio = { version = "1", default-features = false, features = ["sync"] }
thiserror = { workspace = true }
anyhow = { workspace = true }
chrono = { workspace = true }
# A state report's blob is kept base64 in its `reports` file
# (docs/CONVERGENCE_CONTRACT.md section 1).
base64 = { workspace = true }
uuid = { workspace = true }
tracing = { workspace = true }
url = { workspace = true }
# A blob's header carries the SHA-256 of its image (docs/IMAGES_CONTRACT.md);
# the version pimble-crypto already uses.
sha2 = "0.10"

# The desktop's: tokio's whole runtime (the tests' too) and the folder watch
# (src/watch.rs). A browser's worker has neither: its runtime is pimble-host's
# `LocalRuntime`, and it has no folder to watch (docs/ONE_CODEBASE_CONTRACT.md
# seam B, wave 3).
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { workspace = true }
notify = { workspace = true }

[dev-dependencies]
tempfile = "3"
# `PIMBLE_TEST_DISK=memory` runs the suite on the memory disk (pimble_host::disk::testfs).
pimble-host = { workspace = true, features = ["test-disk"] }
# A sealed disk's key in local.rs's test of a file that does not open.
pimble-crypto = { workspace = true }
