[package]
name = "pimble-discussion"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Discussions (docs/DISCUSSIONS_CONTRACT.md): the co-edited thread in a discussion node's `data` root, its order and its message bodies. No UI. Pure Rust, native and wasm32."

[dependencies]
pimble-core = { workspace = true }
pimble-crdt = { workspace = true }
yrs = { workspace = true }
uuid = { workspace = true }
thiserror = { workspace = true }

# uuid v4 needs a randomness backend in the browser; the native build has one.
[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
uuid = { workspace = true, features = ["js"] }
