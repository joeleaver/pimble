[package]
name = "pimble-plugin-host"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Runs Pimble plugins: applies a guest's DOM op log to the app's document and routes events back"

[dependencies]
pimble-plugin-abi = { workspace = true }
# The API a plugin's calls are made through (`bridge`): the app's own backend.
pimble-api = { workspace = true }
pimble-core = { workspace = true }
serde = { workspace = true }
# The same rinch-core the app's rinch uses (git main, one package in the lock):
# the host applies a guest's ops through the app's own `dyn DomDocument` and
# registers its proxy handlers in the app's handler registries.
rinch-core = { git = "https://github.com/joeleaver/rinch.git", branch = "main" }
tracing = { workspace = true }
# The plugin library (`library`): its index, and the check every downloaded
# plugin passes (the same key and check as desktop updates).
serde_json = { workspace = true }
base64 = { workspace = true }
ed25519-dalek = "2"
sha2 = "0.10"
semver = "1"
# The desktop engine. Off by default so that a build without it (the browser
# app's, wave 3) compiles none of wasmtime; the desktop app turns it on.
wasmtime = { workspace = true, optional = true }
wasmtime-wasi = { workspace = true, optional = true }
# Running a plugin's tools for an agent with no window (`tools`): one thread,
# a LocalSet, its API calls answered as they finish.
tokio = { workspace = true, optional = true }
# The browser's engine (wave 3): the page's own `WebAssembly`, reached through
# js-sys, with imports made of wasm-bindgen closures.
wasm-bindgen = { version = "0.2", optional = true }
js-sys = { version = "0.3", optional = true }
wasm-bindgen-futures = { version = "0.4", optional = true }

[features]
default = []
wasm-host = ["dep:wasmtime", "dep:wasmtime-wasi", "dep:tokio"]
# `pimble-plugin-index`, which the Release workflow runs to write the library's
# index from the built plugins.
index-tool = ["wasm-host"]
js-host = ["dep:wasm-bindgen", "dep:js-sys", "dep:wasm-bindgen-futures"]

[[bin]]
name = "pimble-plugin-index"
path = "src/bin/pimble-plugin-index.rs"
required-features = ["index-tool"]

[dev-dependencies]
rinch-core = { git = "https://github.com/joeleaver/rinch.git", branch = "main", features = ["test-util"] }

# The API bridge end to end (tests/bridge.rs): the built hello plugin's calls made
# through a real in-process server, as the app's backend makes them. None of it
# builds for the browser, where only the engine's own test runs (tests/js.rs).
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
pimble-server = { workspace = true }
pimble-client = { workspace = true }
pimble-rpc = { workspace = true }
tokio = { workspace = true }
tempfile = "3"
futures = { workspace = true }
chrono = { workspace = true }
pimble-crdt = { workspace = true }
serde_json = { workspace = true }

# The browser engine against hand-written guests, under wasm-bindgen-test
# (tests/js.rs): the guests are WAT, which the page's WebAssembly cannot read.
[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3"
wat = "1"
