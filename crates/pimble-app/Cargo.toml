[package]
name = "pimble-app"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Rinch application for Pimble: the desktop binary and the UI library the web app reuses"

[lib]
name = "pimble_app"
path = "src/lib.rs"

[[bin]]
name = "pimble"
path = "src/main.rs"
# The desktop binary is the native build by definition: the embedded server,
# the tokio runtime and the window all live behind `native`.
required-features = ["native"]

[dependencies]
pimble-core = { workspace = true }
pimble-client = { workspace = true }
pimble-rpc = { workspace = true }
pimble-crdt = { workspace = true }
# Fits a picture under the size limit before it is stored (docs/IMAGES_CONTRACT.md).
pimble-image = { workspace = true }
# File > Import: parses RTF, Word and Scrivener into nodes (docs/IMPORT_CONTRACT.md).
# Parsing only; the app writes what it parses through its own commands.
pimble-import = { workspace = true }
chrono = { workspace = true }
# rinch is declared here rather than inherited from the workspace because this
# crate is the only consumer and it needs `default-features = false`: `desktop`
# (and `collaboration`, which implies it) must stay out of a web build, and a
# member cannot switch a workspace dependency's defaults off. Still GitHub
# `main`, never a path; `cargo update rinch` moves the pin as before.
rinch = { git = "https://github.com/joeleaver/rinch.git", branch = "main", default-features = false, features = [
    "components",
    "theme",
] }
rinch-tabler-icons = { workspace = true }
rinch-editor-core = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }
crossbeam-channel = { workspace = true }
base64 = { workspace = true }
url = { workspace = true }

# --- native only (the desktop shell and the embedded server) ----------------
pimble-server = { workspace = true, optional = true }
pimble-store = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
tracing-subscriber = { workspace = true, optional = true }
# Opens a followed web link in the system browser (docs/LINKS_CONTRACT.md).
open = { version = "5", optional = true }

# --- web only (the browser DOM backend) ------------------------------------
# The same `EditorHandle` / `Editor` as desktop, reached through the browser
# backend instead of the desktop one, with the same yrs collaboration adapter.
rinch-web = { git = "https://github.com/joeleaver/rinch.git", branch = "main", features = [
    "collaboration",
], optional = true }
js-sys = { version = "0.3", optional = true }
wasm-bindgen-futures = { version = "0.4", optional = true }
# `persistence.rs` remembers the theme choice in `localStorage`, which is the
# browser's equivalent of the desktop's `state.json`; `links.rs` copies a link
# with `navigator.clipboard`.
# `pictures.rs` picks a file with a hidden `<input type="file">` and reads it.
web-sys = { version = "0.3", optional = true, features = [
    "Window", "Storage", "Navigator", "Clipboard",
    "Document", "Node", "Element", "HtmlElement", "HtmlInputElement",
    "Event", "EventTarget", "FileList", "File", "Blob",
] }
wasm-bindgen = { version = "0.2", optional = true }

[dev-dependencies]
tempfile = "3"

[features]
# `native` is the desktop app: the embedded server, the tokio backend thread,
# the window, menus, file dialogs and the clipboard. `web` is the browser
# build, which supplies its own backend and mounts through `rinch-web`.
#
# Semantic search is on by default through the statically linked ONNX runtime
# (cargo downloads it once at build time; the embedding model downloads to the
# user's data dir on first run). `--no-default-features --features native`
# is the keyword-only desktop app that needs no network at build time; plain
# `--no-default-features` is the UI library the web app links. See
# crates/pimble-search/Cargo.toml for the link modes.
default = ["native", "onnx-download"]
native = [
    "dep:pimble-server",
    "dep:open",
    "dep:pimble-store",
    "dep:tokio",
    "dep:tracing-subscriber",
    "rinch/desktop",
    # GPU rendering (vello over wgpu). The CPU renderer repaints the whole window
    # on the CPU after every layout change, about 100 ms a frame at 3840x2160.
    # Needs rinch's wgpu fork, patched in the root Cargo.toml.
    "rinch/gpu",
    "rinch/file-dialogs",
    "rinch/clipboard",
    "rinch/debug",
    # Implies `rinch/desktop`; the browser build gets the same adapter through
    # `rinch-web/collaboration` instead.
    "rinch/collaboration",
]
web = ["dep:rinch-web", "dep:js-sys", "dep:wasm-bindgen", "dep:wasm-bindgen-futures", "dep:web-sys"]
onnx-download = ["native", "pimble-server/onnx-download"]
onnx-dynamic = ["native", "pimble-server/onnx-dynamic"]
