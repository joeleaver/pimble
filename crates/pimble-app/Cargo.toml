[package]
name = "pimble-app"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Rinch desktop application for Pimble"

[[bin]]
name = "pimble"
path = "src/main.rs"

[dependencies]
pimble-core = { workspace = true }
pimble-client = { workspace = true }
pimble-rpc = { workspace = true }
rinch = { workspace = true }
rinch-tabler-icons = { workspace = true }
rinch-editor-core = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
uuid = { workspace = true }
futures = { workspace = true }
crossbeam-channel = { workspace = true }
pimble-crdt = { workspace = true }
base64 = { workspace = true }
pimble-server = { workspace = true }
pimble-store = { workspace = true }
chrono = { workspace = true }
dirs = "6"
rand = "0.9"

[features]
# Semantic search is on by default through the statically linked ONNX runtime
# (cargo downloads it once at build time; the embedding model downloads to the
# user's data dir on first run). Build with --no-default-features for a
# keyword-only app that needs no network at build time. See
# crates/pimble-search/Cargo.toml for the link modes.
default = ["onnx-download"]
onnx-download = ["pimble-server/onnx-download"]
onnx-dynamic = ["pimble-server/onnx-dynamic"]
