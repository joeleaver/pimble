[package]
name = "pimble-crdt"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "CRDT documents for Pimble: yrs for node content and the store document"

[dependencies]
pimble-core = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
chrono = { workspace = true }
tracing = { workspace = true }
yrs = { workspace = true }
rinch-editor-core = { workspace = true, features = ["markdown"] }
pulldown-cmark = { version = "0.12", default-features = false }
rinch-editor-collab = { workspace = true }
# The digest of a document's delete set in its state report
# (`NodeDoc::delete_set_digest`, docs/CONVERGENCE_CONTRACT.md).
sha2 = "0.10"

[dev-dependencies]
uuid = { workspace = true }
