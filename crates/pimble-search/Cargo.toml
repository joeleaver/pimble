[package]
name = "pimble-search"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Search and indexing for Pimble using vector DB and full-text search"

[dependencies]
pimble-core = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
thiserror = { workspace = true }
pimble-crdt = { workspace = true }
pimble-plugins = { workspace = true }
rhypedb-engine = { workspace = true }
rhypedb-schema = { workspace = true }
rhypedb-query = { workspace = true }
sha2 = "0.10"
unicode-segmentation = "1"
uuid = { workspace = true }
tracing = { workspace = true }
chrono = { workspace = true }

[features]
default = []
# Server-side embeddings through rhypedb's fastembed/ONNX stack. onnx-dynamic loads
# libonnxruntime at runtime (ORT_DYLIB_PATH) so day-to-day builds stay offline.
semantic = ["rhypedb-engine/onnx-dynamic"]
