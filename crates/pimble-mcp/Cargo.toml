[package]
name = "pimble-mcp"
description = "An MCP server over stdio: an LLM reads, searches and writes the stores open on this computer (docs/MCP_CONTRACT.md)"
version.workspace = true
edition.workspace = true
authors.workspace = true

[[bin]]
name = "pimble-mcp"
path = "src/main.rs"

[dependencies]
pimble-core = { workspace = true }
pimble-crdt = { workspace = true }
pimble-rpc = { workspace = true }
pimble-client = { workspace = true }
pimble-server = { workspace = true }
rmcp = { version = "3.5", default-features = false, features = ["server", "transport-io", "macros", "base64"] }
schemars = "1.0"
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
base64 = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }

[features]
default = ["onnx-download"]
# The same search the app has, whichever process owns the server.
onnx-download = ["pimble-server/onnx-download"]
onnx-dynamic = ["pimble-server/onnx-dynamic"]
