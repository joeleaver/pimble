[package]
name = "pimble-board"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Boards (docs/IMAGE_MARKUP_CONTRACT.md): the co-edited board document in a node's `data` root, and its renderer and raster cache. No UI. Pure Rust, native and wasm32."

[dependencies]
pimble-crdt = { workspace = true }
yrs = { workspace = true }
uuid = { workspace = true }
thiserror = { workspace = true }
# Pictures embedded in SVG export as data URIs.
base64 = { workspace = true }
# Rendering: pure Rust, runs in wasm. tiny-skia without its PNG codec (pictures are
# decoded by `image`, the same build pimble-image uses).
tiny-skia = { version = "0.11", default-features = false, features = ["std", "simd"] }
# Glyph outlines from the one bundled font (fonts/NotoSans-Regular.ttf, SIL OFL 1.1,
# fonts/OFL.txt), filled as tiny-skia paths so board text transforms like any shape.
ttf-parser = { version = "0.25", default-features = false, features = ["std"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
# Combining paths (docs/DRAWING_CONTRACT.md, "Spike: combining"): a robust
# sweep line over Bézier curves, MIT or Apache-2.0, pure Rust (wasm too).
linesweeper = "0.5"
kurbo = "0.13"
# SVG in: usvg (MIT or Apache-2.0) resolves CSS, `use`, units, viewBox,
# shapes and gradients into plain paths; no text shaping or system fonts
# (text is read with svgtypes off usvg's roxmltree, as text elements).
usvg = { version = "0.49", default-features = false }
svgtypes = "0.16"

# uuid v4 needs a randomness backend in the browser; the native build has one.
[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
uuid = { workspace = true, features = ["js"] }

# The pyramid test bounds a render by the thread's CPU clock
# (`clock_gettime(CLOCK_THREAD_CPUTIME_ID)`), which a loaded machine does not
# stretch the way it stretches a wall clock.
[target.'cfg(unix)'.dev-dependencies]
libc = "0.2"
