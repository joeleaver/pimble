[package]
name = "pimble-crypto"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Client-side cryptography for Pimble Cloud: password-derived keys, account keypairs, key envelopes, encrypted blobs. Pure Rust, native and wasm32."

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
base64 = { workspace = true }
uuid = { workspace = true }
thiserror = { workspace = true }
# Agent K adds the RustCrypto crates here (argon2, chacha20poly1305, x25519-dalek,
# ed25519-dalek, hkdf, sha2, hmac, rand, zeroize) and the wasm32 `getrandom` js feature.

[target.'cfg(target_arch = "wasm32")'.dependencies]
uuid = { workspace = true, features = ["js"] }
