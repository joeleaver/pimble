# Pimble plugins and the SDK they are written with (docs/PLUGINS_CONTRACT.md).
#
# Its own workspace, not a part of the main one: plugins build for wasm32-wasip1
# with their own lock and target directory. Both workspaces track rinch main
# (the wasip1 gating, joeleaver/rinch#2088, merged on 2026-11-02); each lock pins
# its own revision. Build every plugin with
#
#   cargo build --release --target wasm32-wasip1
#
# and test the SDK natively with `cargo test -p pimble-plugin-sdk`. To build and
# install them into this device's plugins folder: scripts/plugins/install.sh.
[workspace]
resolver = "2"
members = ["../crates/pimble-plugin-sdk", "hello-viewer", "stuck-viewer", "kanban-viewer"]

[profile.release]
# Plugins are loaded and compiled by the app at start: small modules load faster.
opt-level = "s"
lto = true
codegen-units = 1

# Kanban drags are built against joeleaver/rinch#2093 (sortable lists, #2091),
# not merged yet: every rinch crate of this workspace comes from its branch at
# the reviewed revision. The main workspace stays on rinch main. Remove this
# block when #2093 merges (`cargo update -p rinch` then moves the lock to main).
# The URL is spelled with `www.` because a patch must name another source
# than the one it patches.
[patch."https://github.com/joeleaver/rinch.git"]
rinch = { git = "https://www.github.com/joeleaver/rinch.git", rev = "b63871e68e0182d76b942e6e629aa049acd8fd7b" }
rinch-components = { git = "https://www.github.com/joeleaver/rinch.git", rev = "b63871e68e0182d76b942e6e629aa049acd8fd7b" }
rinch-core = { git = "https://www.github.com/joeleaver/rinch.git", rev = "b63871e68e0182d76b942e6e629aa049acd8fd7b" }
rinch-editor-collab = { git = "https://www.github.com/joeleaver/rinch.git", rev = "b63871e68e0182d76b942e6e629aa049acd8fd7b" }
rinch-editor-core = { git = "https://www.github.com/joeleaver/rinch.git", rev = "b63871e68e0182d76b942e6e629aa049acd8fd7b" }
rinch-macros = { git = "https://www.github.com/joeleaver/rinch.git", rev = "b63871e68e0182d76b942e6e629aa049acd8fd7b" }
rinch-platform = { git = "https://www.github.com/joeleaver/rinch.git", rev = "b63871e68e0182d76b942e6e629aa049acd8fd7b" }
rinch-tabler-icons = { git = "https://www.github.com/joeleaver/rinch.git", rev = "b63871e68e0182d76b942e6e629aa049acd8fd7b" }
rinch-theme = { git = "https://www.github.com/joeleaver/rinch.git", rev = "b63871e68e0182d76b942e6e629aa049acd8fd7b" }
rinch-words = { git = "https://www.github.com/joeleaver/rinch.git", rev = "b63871e68e0182d76b942e6e629aa049acd8fd7b" }
