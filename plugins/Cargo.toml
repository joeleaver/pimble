# Pimble plugins and the SDK they are written with (docs/PLUGINS_CONTRACT.md).
#
# Its own workspace, not a part of the main one: plugins build for wasm32-wasip1
# with their own lock and target directory, and the SDK is built against a rinch
# branch until that change merges (joeleaver/rinch#2088), while the app stays on
# rinch main. Build every plugin with
#
#   cargo build --release --target wasm32-wasip1
#
# and test the SDK natively with `cargo test -p pimble-plugin-sdk`.
[workspace]
resolver = "2"
members = ["../crates/pimble-plugin-sdk", "hello-viewer", "stuck-viewer"]

[profile.release]
# Plugins are loaded and compiled by the app at start: small modules load faster.
opt-level = "s"
lto = true
codegen-units = 1
