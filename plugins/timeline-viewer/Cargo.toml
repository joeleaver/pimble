[package]
name = "timeline-viewer"
version = "0.1.1"
edition = "2021"
license = "MIT"
publish = false
description = "The timeline metanode viewer: nodes on a line of time by their own fields, in any calendar (docs/TIMELINE_CONTRACT.md)"

# In the plugin library (docs/SETTINGS_CONTRACT.md section 4).
[package.metadata.pimble]
library = true
summary = "Nodes on a line of time by their own date fields, in any calendar."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
pimble-plugin-sdk = { path = "../../crates/pimble-plugin-sdk" }
# Calendars are data (docs/TIMELINE_CONTRACT.md section 3); the view remembered on this device.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
