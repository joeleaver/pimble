[package]
name = "kanban-viewer"
version = "0.1.1"
edition = "2021"
license = "MIT"
publish = false
description = "The kanban metanode viewer: columns and cards over a tree two levels deep (docs/KANBAN_CONTRACT.md)"

# In the plugin library (docs/SETTINGS_CONTRACT.md section 4).
[package.metadata.pimble]
library = true
summary = "Columns of cards from a node's children; drag a card to move it."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
pimble-plugin-sdk = { path = "../../crates/pimble-plugin-sdk" }
# The value a rename's `explicit_title` flag is written as.
serde_json = "1"
