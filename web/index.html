<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pimble</title>
    <link data-trunk rel="copy-file" href="../assets/brand/pimble-icon.svg" />
    <link data-trunk rel="copy-file" href="../assets/brand/png/pimble-32.png" />
    <!-- The font files document themes draw with, and their licenses
         (assets/fonts/README.md), served at /app/fonts/ for the @font-face
         rules the app writes (pimble_themes::fonts::font_face_css). -->
    <link data-trunk rel="copy-dir" href="../assets/fonts" />
    <!-- The note editor's spelling dictionary (assets/dictionaries/README.md),
         fetched from /app/dictionaries/ by pimble_app::spelling::start_web. -->
    <link data-trunk rel="copy-dir" href="../assets/dictionaries" />
    <link rel="icon" href="pimble-icon.svg" type="image/svg+xml">
    <link rel="icon" href="pimble-32.png" sizes="32x32" type="image/png">
    <style>
        html, body { margin: 0; padding: 0; height: 100%; }
        body { background: #1a1b1e; }
    </style>
    <link data-trunk rel="rust" data-wasm-opt="z" />
    <!-- The browser's own Pimble server (docs/ONE_CODEBASE_CONTRACT.md wave 4,
         the default; ?server=old for the old path until wave 5): the hub that elects the leader tab, and the
         worker it starts, built from crates/pimble-worker (through web/worker) with its `entry`
         feature; build/post_build.sh renames its files by their contents and
         names the loader in the meta tag below. -->
    <meta name="pimble-worker-loader" content="pimble-web-worker_loader.js">
    <script data-trunk src="hub.js"></script>
    <link data-trunk rel="rust" href="worker/Cargo.toml" data-type="worker"
          data-bindgen-target="no-modules" data-loader-shim 
          data-cargo-profile-release="worker" data-wasm-opt="z" />
</head>
<body></body>
</html>
